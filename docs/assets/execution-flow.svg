<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="t d"><title id="t">Canary Covenant execution flow</title><desc id="d">Feature eligibility, incident recall and sequential evidence converge at policy, then promotion or rollback is witnessed.</desc><style>.bg{fill:#07121f}.box{fill:#12283f;stroke:#5eead4;stroke-width:2}.gate{fill:#241c3c;stroke:#c084fc;stroke-width:2}.txt{fill:#f0f9ff;font:600 16px system-ui}.sub{fill:#a5c6d8;font:13px system-ui}.flow{fill:none;stroke:#38bdf8;stroke-width:3;stroke-dasharray:9 7;animation:m 3s linear infinite}.safe{stroke:#34d399}.stop{stroke:#fb7185}@keyframes m{to{stroke-dashoffset:-32}}</style><rect class="bg" width="1100" height="420" rx="24"/><g class="box"><rect x="50" y="45" width="220" height="80" rx="14"/><rect x="50" y="170" width="220" height="80" rx="14"/><rect x="50" y="295" width="220" height="80" rx="14"/></g><rect class="gate" x="410" y="145" width="260" height="130" rx="18"/><g class="box"><rect x="825" y="70" width="220" height="95" rx="14"/><rect x="825" y="255" width="220" height="95" rx="14"/></g><g class="txt" text-anchor="middle"><text x="160" y="79">OpenFeature</text><text x="160" y="204">RuVector recall</text><text x="160" y="329">Betting e-process</text><text x="540" y="190">Policy + grant boundary</text><text x="935" y="108">PROMOTE</text><text x="935" y="293">ROLLBACK</text></g><g class="sub" text-anchor="middle"><text x="160" y="103">cohort eligibility</text><text x="160" y="228">nearest prior incidents</text><text x="160" y="353">valid under continuous looks</text><text x="540" y="218">conjunctive gates</text><text x="540" y="240">no self-promotion</text><text x="935" y="136">single-use + RVF witness</text><text x="935" y="321">idempotent recovery</text></g><path class="flow" d="M270 85C350 85 350 170 410 170M270 210H410M270 335C350 335 350 250 410 250"/><path class="flow safe" d="M670 180C760 180 760 118 825 118"/><path class="flow stop" d="M670 240C760 240 760 303 825 303"/></svg>
