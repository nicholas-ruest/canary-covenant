[workspace]
members = ["crates/*"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1.40", features = ["rt-multi-thread","macros","sync"] }
open-feature = "=0.3.0"
ruvector-core = { version = "=2.4.0", default-features = false, features = ["storage"] }
rvf-crypto = "=0.2.0"
tempfile = "3.14"
clap = { version = "4.5", features = ["derive"] }
